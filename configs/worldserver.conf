# =====================================================
#  WoW 3.3.5a Emulator -- Configuration File
#  Windows + MySQL + WSS Word/Statement Scripting
# =====================================================

[worldserver]
Port = 8085
WorldName = WoW 3.3.5a Emulator
MaxPlayers = 5000
ThreadCount = 4
DataPath = data/

[authserver]
Port = 3724
BindIP = 0.0.0.0

[database]
# MySQL connection settings
Type = mysql
Host = 127.0.0.1
Port = 3306
User = root
Password =
Database = wow_emulator

[scripting]
# WSS (Word Statement Script) engine
LoadScripts = 1
ScriptPath = scripts/
AutoReload = 0
