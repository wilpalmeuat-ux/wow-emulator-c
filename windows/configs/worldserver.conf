# WoW Emulator Configuration — Windows / MySQL

[worldserver]
Port = 8085
WorldName = "WoW 3.3.5a Emulator"
MaxPlayers = 5000

[authserver]
Port = 3724
BindIP = "0.0.0.0"

[database]
Type = "mysql"
Host = "127.0.0.1"
Port = 3306
User = "root"
Password = "password"
Database = "wow_emulator"

[scripting]
LoadScripts = true
ScriptPath = "scripts"
AutoLoad = true
